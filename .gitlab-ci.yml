stages:
  - lint
  - test
  - build
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/pip"
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.cache/uv"

workflow:
  rules:
    # Run on merge request events
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Run on tag pushes (for publishing)
    - if: $CI_COMMIT_TAG
    # Skip branch pipelines when an MR is already open (avoid duplicates)
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # Run on plain branch pushes
    - if: $CI_COMMIT_BRANCH

default:
  image: python:3.12
  tags:
    - csm-docker
  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install uv
    # Use HTTPS for GitHub submodules (avoids SSH host key issues)
    - git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
  cache:
    key: "${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip
      - .cache/uv

lint:
  stage: lint
  script:
    - uv pip install --system pre-commit
    - pre-commit run --all-files

test:
  stage: test
  image: "python:${PYTHON_VERSION}"
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13", "3.14"]
  script:
    - uv pip install --system -e ".[implementations,ml]" pytest pytest-cov
    - python scripts/check_rastercube_migration.py --ci
    - python -m pytest --junitxml=report.xml --cov=openeo_processes_dedl_slim --cov-report=term --cov-report=xml:coverage.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 month

build-package:
  stage: build
  script:
    - uv pip install --system build
    - python -m build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

publish-package:
  stage: publish
  dependencies:
    - build-package
  variables:
    PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi"
  script:
    - uv pip install --system twine
    - python -m twine upload --repository-url "${PACKAGE_REGISTRY_URL}" -u gitlab-ci-token -p "${CI_JOB_TOKEN}" dist/*
  rules:
    - if: $CI_COMMIT_TAG
