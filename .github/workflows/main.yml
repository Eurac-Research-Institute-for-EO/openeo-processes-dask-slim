name: Tests

on:
  push:
    paths-ignore:
      - 'docs/**'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - 'docs/**'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.image }}
    strategy:
      matrix:
        os: [Ubuntu]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: Ubuntu
            image: ubuntu-24.04
      fail-fast: false
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Get full Python version
        id: full-python-version
        run: echo version=$(python -c "import sys; print('-'.join(str(v) for v in sys.version_info))") >> $GITHUB_OUTPUT

      - name: Install uv
        run: pip install uv

      - name: Set up cache
        uses: actions/cache@v5
        id: cache
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.full-python-version.outputs.version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: uv pip install --system -e ".[implementations,ml]" pytest pytest-cov pre-commit

      - name: Pre-commit hooks
        run: pre-commit run --all-files

      - name: RasterCube migration static check
        run: python scripts/check_rastercube_migration.py --ci

      - name: Run pytest
        run: python -m pytest --cov=openeo_processes_dedl_slim --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
